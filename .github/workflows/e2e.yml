name: E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "tests/e2e/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cleanbrowser
          POSTGRES_USER: cleanbrowser
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanbrowser -d cleanbrowser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://cleanbrowser:devpassword@localhost:5432/cleanbrowser
      PYTHONPATH: ${{ github.workspace }}
      # The backend serves the built frontend on a single port in this job.
      E2E_BASE_URL: http://localhost:8080
      # Disable verification email side-effects during tests.
      EMAIL_VERIFICATION_REQUIRED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Run migrations (if alembic configured)
        run: |
          if [ -f backend/alembic.ini ]; then
            (cd backend && alembic upgrade head) || echo "alembic upgrade skipped/failed"
          fi

      - name: Start backend
        run: |
          nohup python -m uvicorn backend.main:app \
            --host 0.0.0.0 --port 8080 \
            > backend.log 2>&1 &
          echo "Waiting for backend on :8080..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null \
               || curl -sf http://localhost:8080/ > /dev/null; then
              echo "Backend is up."
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not start in time."
          cat backend.log
          exit 1

      - name: Install Playwright + browsers
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Typecheck E2E
        working-directory: tests/e2e
        run: npx tsc --noEmit

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npm test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/e2e/screenshots/
          retention-days: 14

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: tests/e2e/playwright-junit.xml
          retention-days: 30

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          retention-days: 7
